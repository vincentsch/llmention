  - id: fact.science.physics.speed-of-light
    type: factoid.single_answer
    question: "What is the exact speed of light in vacuum in meters per second?"
    answers:
      canonical: "299792458"
      aliases: ["299,792,458", "299792458 m/s", "299,792,458 m/s"]
