id: research.factoid
version: 2
type: factoid
purpose: "Check short factual answers against one right answer and its accepted spellings."
context_mode: item_local
default_modes: [memory, search_auto]
repetitions: 1
variants:
  - id: default
evaluators:
  - id: exact
    type: exact_or_alias
metrics:
  - id: factoid.correct_rate
    evaluator: exact
    kind: rate
  - id: factoid.incorrect_rate
    evaluator: exact
    kind: rate
  - id: factoid.not_attempted_rate
    evaluator: exact
    kind: rate
  - id: factoid.overconfident_wrong_rate
    evaluator: exact
    kind: rate
  - id: factoid.search_recovery_rate
    evaluator: exact
    kind: rate
  - id: factoid.search_regression_rate
    evaluator: exact
    kind: rate
items:
  - id: fact.history.space.apollo11.commander
    type: factoid.single_answer
    question: "Who commanded Apollo 11?"
    answers:
      canonical: "Neil Armstrong"
      aliases: ["Armstrong", "Neil A. Armstrong"]
    grading:
      type: exact_or_alias
      abstain_allowed: true
      confidence: optional
    known_wrong_answers:
      - id: buzz-aldrin
        aliases: ["Buzz Aldrin"]
    sources:
      - title: "Apollo 11 Mission Overview"
        url: "https://example.invalid/fact/apollo11-mission-overview"
    dimensions: {}
    comparison_group_id: ""
    tags: [history, space, person]
  - id: fact.science.chemistry.gold-symbol
    type: factoid.single_answer
    question: "What is the chemical symbol for gold?"
    answers:
      canonical: "Au"
      aliases: ["gold symbol Au"]
    grading:
      type: exact_or_alias
      abstain_allowed: true
      confidence: optional
    sources:
      - title: "Gold Element Reference"
        url: "https://example.invalid/fact/gold-element-reference"
    dimensions: {}
    comparison_group_id: ""
    tags: [science, chemistry]
  - id: fact.geography.kenya.capital
